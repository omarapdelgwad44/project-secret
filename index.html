<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#110c0e" />
    <meta name="description" content="A birthday gift for Jana — October 5" />
    <title>Happy Birthday, Jana</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Outfit:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%B9%3C/text%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="grain" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>
    <div class="glow" aria-hidden="true"></div>
    <div class="bloom bloom-a" aria-hidden="true"></div>
    <div class="bloom bloom-b" aria-hidden="true"></div>
    <canvas id="fx" class="fx-canvas" aria-hidden="true"></canvas>
    <div class="fall-layer" id="fallLayer" aria-hidden="true"></div>
    <div class="flash" id="flash" aria-hidden="true"></div>
    <div class="balloons" id="balloons" aria-hidden="true"></div>

    <button
      class="sound-toggle"
      id="soundToggle"
      type="button"
      aria-label="Mute music"
      aria-pressed="false"
      hidden
    >
      <span class="sound-on" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18">
          <path
            fill="currentColor"
            d="M4 9v6h3.2L12 19.8V4.2L7.2 9H4zm11 1.5a3.5 3.5 0 0 1 0 3l1.6 1.1a5.5 5.5 0 0 0 0-5.2L15 10.5zm2.6-3.2a8 8 0 0 1 0 9.4l1.6 1.1a10 10 0 0 0 0-11.6l-1.6 1.1z"
          />
        </svg>
      </span>
      <span class="sound-off" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18">
          <path
            fill="currentColor"
            d="M4 9v6h3.2L12 19.8V4.2L7.2 9H4zm12.3-.5 1.4-1.4 1.4 1.4 1.4-1.4 1.4 1.4-1.4 1.4 1.4 1.4-1.4 1.4-1.4-1.4-1.4 1.4-1.4-1.4 1.4-1.4-1.4-1.4z"
          />
        </svg>
      </span>
    </button>

    <main class="stage">
      <section class="gift-scene" id="giftScene">
        <svg class="flourish" viewBox="0 0 200 24" aria-hidden="true">
          <path
            fill="none"
            stroke="currentColor"
            stroke-width="1.1"
            d="M10 12h52c8 0 10-8 18-8s10 8 18 8 10-8 18-8 10 8 18 8h56"
          />
          <circle cx="100" cy="12" r="2.2" fill="currentColor" />
        </svg>
        <p class="whisper">A little something, just for you</p>
        <div class="gift" id="gift">
          <div class="parcel">
            <div class="box-inner">
              <span class="inner-heart">♥</span>
            </div>
            <div class="box-body"></div>
            <div class="lid"></div>
            <div class="wrap-skin">
              <div class="ribbon ribbon-sash"></div>
            </div>
            <div class="bow" aria-hidden="true">
              <svg viewBox="0 0 140 110">
                <defs>
                  <linearGradient id="silk" x1="0" y1="0" x2="0.2" y2="1">
                    <stop offset="0%" stop-color="#f7c9d0" />
                    <stop offset="38%" stop-color="#d45c72" />
                    <stop offset="72%" stop-color="#a8334c" />
                    <stop offset="100%" stop-color="#6d1c30" />
                  </linearGradient>
                  <linearGradient id="silkSoft" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stop-color="#ffe6ea" />
                    <stop offset="100%" stop-color="#c94b63" />
                  </linearGradient>
                </defs>
                <path
                  fill="url(#silk)"
                  d="M68 50C52 66 30 92 22 104c8-4 22-18 34-32 4-5 8-12 12-22z"
                />
                <path
                  fill="url(#silk)"
                  d="M72 50c16 16 38 42 46 54-8-4-22-18-34-32-4-5-8-12-12-22z"
                />
                <ellipse
                  cx="46"
                  cy="40"
                  rx="34"
                  ry="20"
                  fill="url(#silk)"
                  transform="rotate(-26 46 40)"
                />
                <ellipse
                  cx="94"
                  cy="40"
                  rx="34"
                  ry="20"
                  fill="url(#silk)"
                  transform="rotate(26 94 40)"
                />
                <ellipse
                  cx="46"
                  cy="40"
                  rx="14"
                  ry="8"
                  fill="#5a1826"
                  opacity=".35"
                  transform="rotate(-26 46 40)"
                />
                <ellipse
                  cx="94"
                  cy="40"
                  rx="14"
                  ry="8"
                  fill="#5a1826"
                  opacity=".35"
                  transform="rotate(26 94 40)"
                />
                <ellipse cx="70" cy="42" rx="15" ry="11" fill="url(#silkSoft)" />
                <ellipse cx="70" cy="42" rx="8" ry="6" fill="#7a2234" opacity=".4" />
              </svg>
            </div>
            <div class="seal">
              <span>5</span>
              <small>Oct</small>
            </div>
          </div>
        </div>
        <button class="open-btn" id="openBtn" type="button">
          Untie the ribbon
        </button>
      </section>

      <section class="celebrate-scene" id="celebrateScene" hidden>
        <h1 class="title" id="title" aria-label="Happy Birthday to you"></h1>
        <div class="ornament" aria-hidden="true">✦</div>
        <div class="name-stage" id="nameStage">
          <canvas id="nameCanvas" aria-hidden="true"></canvas>
          <h2 class="visually-hidden">Jana</h2>
        </div>
        <div class="cake-area" id="cakeArea" hidden>
          <button class="cake" id="cake" type="button" aria-label="Blow out the candles">
            <span class="candle c1"><i class="flame"></i><i class="smoke"></i></span>
            <span class="candle c2"><i class="flame"></i><i class="smoke"></i></span>
            <span class="candle c3"><i class="flame"></i><i class="smoke"></i></span>
            <svg class="cake-art" viewBox="0 0 200 168" aria-hidden="true">
              <ellipse cx="100" cy="158" rx="84" ry="8" fill="#b08962" />
              <ellipse cx="100" cy="154" rx="78" ry="5.5" fill="#ead7b8" />
              <path
                fill="#6e2c3a"
                d="M30 108h140c6 0 10 5 10 11v26c0 9-32 15-80 15s-80-6-80-15v-26c0-6 4-11 10-11z"
              />
              <path
                fill="#7d3646"
                d="M30 108h140c2 10-8 18-20 18H50c-12 0-22-8-20-18z"
              />
              <path
                fill="#f4d5db"
                d="M28 100c10 0 12 18 22 18s12-18 22-18 12 16 22 16 12-16 22-16 12 18 22 18 13-18 22-18v14H28z"
              />
              <path
                fill="#f7e6e8"
                d="M28 92h144c4 6 2 12-6 14H36c-10-2-10-8-8-14z"
              />
              <path
                fill="#944656"
                d="M54 68h92c5 0 8 4 8 9v24c0 7-22 12-54 12s-54-5-54-12V77c0-5 3-9 8-9z"
              />
              <path
                fill="#a35264"
                d="M54 68h92c1 8-8 14-16 14H70c-10 0-17-6-16-14z"
              />
              <path
                fill="#f7dde2"
                d="M52 62c8 0 9 14 16 14s9-14 16-14 9 12 16 12 9-12 16-12 9 14 16 14 10-14 16-14v12H52z"
              />
              <path
                fill="#fff1f3"
                d="M52 54h96c3 5 2 10-4 12H58c-8-2-8-7-6-12z"
              />
              <g>
                <rect x="74" y="26" width="7" height="32" rx="1.6" fill="#f6ead2" />
                <rect x="96.5" y="22" width="7" height="36" rx="1.6" fill="#f6ead2" />
                <rect x="119" y="26" width="7" height="32" rx="1.6" fill="#f6ead2" />
                <rect x="74" y="30" width="7" height="4" fill="#e7b7c0" />
                <rect x="96.5" y="27" width="7" height="4" fill="#e7b7c0" />
                <rect x="119" y="30" width="7" height="4" fill="#e7b7c0" />
                <rect x="76.4" y="22" width="2.2" height="5" fill="#4a3428" />
                <rect x="98.9" y="18" width="2.2" height="5" fill="#4a3428" />
                <rect x="121.4" y="22" width="2.2" height="5" fill="#4a3428" />
              </g>
            </svg>
          </button>
          <button class="wish-btn" id="wishBtn" type="button">Make a wish</button>
        </div>
        <p class="final-line" id="finalLine" lang="ar" dir="rtl">الصغنن حجي كبر سنة 🌚</p>
      </section>
    </main>

    <template id="tplRose">
      <span class="petal">
        <svg viewBox="0 0 36 36">
          <g transform="translate(18 20)">
            <ellipse rx="5.5" ry="9.5" fill="#7d2f3d" transform="rotate(0)" />
            <ellipse rx="5.5" ry="9.5" fill="#b4495c" transform="rotate(60)" />
            <ellipse rx="5.5" ry="9.5" fill="#d76a7c" transform="rotate(120)" />
            <ellipse rx="5.5" ry="9.5" fill="#c45668" transform="rotate(180)" />
            <ellipse rx="5.5" ry="9.5" fill="#933948" transform="rotate(240)" />
            <ellipse rx="5.5" ry="9.5" fill="#e39aa6" transform="rotate(300)" />
            <circle r="3" fill="#f4d6cf" />
          </g>
        </svg>
      </span>
    </template>
    <template id="tplHeart">
      <span class="petal">
        <svg viewBox="0 0 32 32">
          <path
            fill="#d45c72"
            d="M16 28C6 20 3 14 3 9.5A6.5 6.5 0 0 1 16 7.5 6.5 6.5 0 0 1 29 9.5C29 14 26 20 16 28z"
          />
        </svg>
      </span>
    </template>
    <template id="tplSpark">
      <span class="petal petal-spark">
        <svg viewBox="0 0 24 24">
          <path
            fill="#e8c97a"
            d="M12 1.5l1.6 7.2L21 12l-7.4 3.3L12 22.5l-1.6-7.2L3 12l7.4-3.3z"
          />
        </svg>
      </span>
    </template>

    <audio id="bgAudio" loop preload="auto">
      <source src="assets/audio/bg.mp3" type="audio/mpeg" />
      <source src="assets/audio/bg.wav" type="audio/wav" />
    </audio>
    <script src="app.js"></script>
  </body>
</html>
