<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f6efe8" />
    <meta name="description" content="" />
    <title></title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Great+Vibes&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9D%A4%EF%B8%8F%3C/text%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="paper" aria-hidden="true"></div>
    <div class="ambient" aria-hidden="true">
      <span class="float-heart h1">♥</span>
      <span class="float-heart h2">♥</span>
      <span class="float-heart h3">♥</span>
      <span class="spark s1"></span>
      <span class="spark s2"></span>
      <span class="spark s3"></span>
    </div>
    <canvas id="fx" class="fx" aria-hidden="true"></canvas>
    <div id="petals" class="petals" aria-hidden="true"></div>

    <button
      class="music-btn"
      id="musicBtn"
      type="button"
      aria-pressed="false"
      aria-label="Play music"
    >
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <path
          fill="currentColor"
          d="M9 18V6l12-2v12a3.2 3.2 0 1 1-2-3V8L11 9.6V18a3.2 3.2 0 1 1-2 0z"
        />
      </svg>
      <span id="musicLabel">Music</span>
    </button>

    <main class="app">
      <section class="scene is-active" id="welcome" aria-labelledby="welcomeTitle">
        <p class="kicker" id="welcomeTitle"></p>
        <article class="letter-wrap" id="parcel">
          <div class="card-face">
            <span class="seal-heart" aria-hidden="true">♥</span>
            <p class="date" id="dateLabel"></p>
          </div>
          <div class="sash" aria-hidden="true"></div>
          <div class="bow" aria-hidden="true">
            <svg viewBox="0 0 120 90">
              <defs>
                <linearGradient id="silk" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stop-color="#e8a0ad" />
                  <stop offset="50%" stop-color="#8f2f44" />
                  <stop offset="100%" stop-color="#5c1b2c" />
                </linearGradient>
              </defs>
              <path fill="url(#silk)" d="M58 42C44 56 26 78 18 86c8-3 20-16 30-28 4-5 7-10 10-16z" />
              <path fill="url(#silk)" d="M62 42c14 14 32 36 40 44-8-3-20-16-30-28-4-5-7-10-10-16z" />
              <ellipse cx="40" cy="34" rx="28" ry="16" fill="url(#silk)" transform="rotate(-24 40 34)" />
              <ellipse cx="80" cy="34" rx="28" ry="16" fill="url(#silk)" transform="rotate(24 80 34)" />
              <ellipse cx="60" cy="36" rx="12" ry="9" fill="#c46b7a" />
            </svg>
          </div>
        </article>
        <button class="btn" id="untieBtn" type="button"></button>
      </section>

      <section class="scene" id="letter" hidden aria-labelledby="letterTitle">
        <article class="note">
          <p class="note-kicker" id="letterTitle"></p>
          <p class="note-body" id="letterBody"></p>
          <button class="btn" id="surpriseBtn" type="button" hidden></button>
        </article>
      </section>

      <section class="scene" id="finale" hidden aria-labelledby="finaleTitle">
        <h1 class="finale-title" id="finaleTitle"></h1>
        <figure class="photo-frame" id="photoFrame">
          <img id="photo" alt="" hidden />
          <div class="photo-fallback" id="photoFallback" aria-hidden="true">
            <span>♥</span>
          </div>
        </figure>
        <div class="name-stage" id="nameStage">
          <canvas id="nameCanvas" aria-hidden="true"></canvas>
          <h2 class="visually-hidden" id="nameText"></h2>
        </div>
        <p class="finale-line" id="finaleMessage"></p>
        <button class="btn btn-ghost" id="replayBtn" type="button"></button>
      </section>
    </main>

    <audio id="bgAudio" loop preload="none"></audio>
    <script src="config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
